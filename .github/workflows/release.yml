name: Release Electron App

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          path: System-Monitor

      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/system-monitor-api-v2
          path: system-monitor-api-v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: System-Monitor/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Frontend Dependencies
        working-directory: System-Monitor
        run: npm ci

      - name: Publish .NET API (Self-Contained)
        working-directory: system-monitor-api-v2
        run: |
          dotnet publish "System Monitor API v2.csproj" -c Release -r win-x64 --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Build Electron Installer
        working-directory: System-Monitor
        run: npm run electron:build

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: System-Monitor/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
